<td align="center">

<table border="1" width="60%" cellpadding="10">
<tr><td align="center"><h2>STUDENT REGISTRATION</h2></td></tr>
</table>

<br>

<table border="1" width="60%" cellpadding="15">
<form action="#" method="post">
<tr>
<td><b>FULL NAME :</b></td>
<td><input type="text" name="fullname" size="40"></td>
</tr>
<tr>
<td><b>EMAIL ADDRESS :</b></td>
<td><input type="text" name="email" size="40"></td>
</tr>
<tr>
<td><b>MOBILE NUMBER :</b></td>
<td>
<select name="isd_code">
<option>+91</option>
<option>+1</option>
<option>+44</option>
</select>
<input type="text" name="mobile" size="25">
</td>
</tr>
<tr>
<td><b>PASSWORD :</b></td>
<td><input type="password" name="password" size="40"></td>
</tr>
<tr>
<td><b>DATE OF BIRTH :</b></td>
<td><input type="text" name="dob" placeholder="DD/MM/YY" size="40"></td>
</tr>
<tr>
<td><b>COURSE/YEAR :</b></td>
<td>
<select name="course_year">
<option>SELECT</option>
<option>B.Tech Computer Engineering - 1st Year</option>
<option>B.Tech Computer Engineering - 2nd Year</option>
<option>B.Tech Computer Engineering - 3rd Year</option>
<option>B.Tech Computer Engineering - 4th Year</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" align="center">
<input type="submit" value="LOGIN BUTTON">
</td>
</tr>
</form>
</table>

</td>
</tr>
</table>

<br>

<table border="1" width="100%" cellpadding="10">

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Practical 5</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#1f2937}header{background:#173b7a;color:white;padding:18px 5%;font-size:24px;font-weight:bold}main{width:92%;max-width:1050px;margin:30px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 8px 25px #173b7a18}h1,h2{color:#173b7a}button,.btn{background:#2f80ed;color:white;border:0;padding:10px 16px;border-radius:7px;cursor:pointer}input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:6px;margin:5px 0;max-width:100%}label{font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}.error{color:#b91c1c}.success{color:#166534}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:10px;border:1px solid #cbd5e1;text-align:left}th{background:#e8f0ff}nav a{color:white;margin-right:15px}@media(max-width:600px){main{padding:16px}}</style><script defer src="script.js"></script></head><body><header>StudentHub</header><main><h1>Student Registration</h1><form id="registration" novalidate><div class="grid"><label>Full name<input id="name" required autocomplete="name"><small class="error" id="nameError"></small></label><label>Email<input id="email" type="email" required autocomplete="email"><small class="error" id="emailError"></small></label><label>Mobile number<input id="mobile" inputmode="numeric" required><small class="error" id="mobileError"></small></label><label>Password<input id="password" type="password" required><small id="strength"></small><small class="error" id="passwordError"></small></label><label>Confirm password<input id="confirm" type="password" required><small class="error" id="confirmError"></small></label><label>Course<select id="course" required><option value="">Choose course</option><option>Computer Engineering</option><option>Information Technology</option><option>Electronics</option></select><small class="error" id="courseError"></small></label><label>Year<select id="year" required><option value="">Choose year</option><option>1</option><option>2</option><option>3</option><option>4</option></select><small class="error" id="yearError"></small></label><fieldset><legend>Gender</legend><label><input type="radio" name="gender" value="Female"> Female</label><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Other"> Other</label><small class="error" id="genderError"></small></fieldset></div><label><input type="checkbox" id="terms"> I accept the terms and conditions</label><small class="error" id="termsError"></small><p><button type="submit">Register</button></p><p id="result" aria-live="polite"></p></form></main></body></html>

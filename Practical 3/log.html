<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
</head>
<body>
    <h1 align = "center">LOGIN TO STUDENTHUB</h1>
    <form action="student" method="post">
        <fieldset>
            <legend align = "center">User Login</legend>
            <p>
                <lable for="email">Email Address:</lable><br>
                <input type="email" id="email" name="email" placeholder="Enter the email" required></input>
            </p>
            <p>
                <lable for="password">Password:</lable><br>
                <input type="password" id="password" name="password" placeholder="Enter the password" required></input>
            </p>
            <p>
                <lable for="role">Select Role:</lable><br>
                <select id="role" name="role" required>
                    <option value="">---select role--</option>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </p>
            <p>
                        <input type="checkbox" id="remember" name="remember" value="yes">
                        <label for="remember">Remember me</label>
             </p>

            <button type="login">Login</button>
            <button type="reset">Clear</button>

        </fieldset>
    </form>  
</body>
</html>
